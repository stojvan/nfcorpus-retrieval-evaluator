[project]
name = "nfcorpus-retrieval-evaluator"
version = "0.1.0"
description = "A2A green agent that evaluates purple agents on NFCorpus biomedical information retrieval benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "pydantic>=2.12.5",
    "uvicorn>=0.38.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "qdrant-client>=1.7.0",
    "fastapi>=0.100.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
