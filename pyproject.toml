[project]
name = "nfcorpus-retrieval-evaluator"
version = "0.1.0"
description = "Green agent for evaluating retrieval systems on NFCorpus dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.38.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
