version: '3.8'

services:
  green-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "9009:9009"
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    container_name: nfcorpus-green-agent
    restart: unless-stopped
